name: Desktop Windows

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "apps/desktop/**"
      - "libs/braillify/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-bundle:
    name: Verify and bundle NSIS
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: bunx playwright install chromium

      - name: Check TypeScript and Rust
        run: bun -F desktop check

      - name: Run frontend unit tests
        run: bun -F desktop test

      - name: Run Rust command tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build static frontend
        run: bun -F desktop build

      - name: Run Chromium end-to-end tests
        run: bun -F desktop test:e2e

      - name: Build unsigned NSIS installer
        run: bun -F desktop tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: braillify-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
